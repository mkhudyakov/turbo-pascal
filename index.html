
<style>

<div id="tp">
  <div id="menubar">
    <div class="menu-item" onclick="toggleMenu('file',this)"><span>F</span>ile</div>
    <div class="menu-item" onclick="toggleMenu('edit',this)"><span>E</span>dit</div>
    <div class="menu-item" onclick="toggleMenu('run',this)"><span>R</span>un</div>
    <div class="menu-item" onclick="toggleMenu('compile',this)"><span>C</span>ompile</div>
    <div class="menu-item" onclick="toggleMenu('debug',this)"><span>D</span>ebug</div>
    <div class="menu-item" onclick="toggleMenu('options',this)"><span>O</span>ptions</div>
    <div id="menu-title">Turbo Pascal  Version 7.0  Copyright (c) 1983,92 Borland</div>
    <button id="compile-btn" onclick="doCompile()">Alt+F9 Compile</button>
    <button id="run-btn" onclick="doRun()">F9 Run</button>
  </div>

  <div id="dropdown"></div>

  <div id="workspace">
    <div id="editor-panel">
      <div id="editor-titlebar">
        <span>&#9553; NONAME00.PAS</span>
        <span id="modified-flag"></span>
      </div>
      <div id="editor-wrap">
        <div id="line-nums"></div>
        <textarea id="editor" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
      </div>
    </div>
    <div id="output-panel">
      <div id="output-titlebar">
        <span>&#9553; Output / Messages</span>
        <span id="compile-status" style="font-size:11px;"></span>
      </div>
      <div id="output-screen"></div>
    </div>
  </div>

  <div class="hint-bar">
    <span class="hint"><b>F9</b> Run</span>
    <span class="hint"><b>Alt+F9</b> Compile</span>
    <span class="hint"><b>F1</b> Help</span>
    <span class="hint"><b>Alt+X</b> Exit</span>
    <span class="hint"><b>F2</b> Save</span>
    <span class="hint"><b>Ctrl+Z</b> Undo</span>
  </div>
  <div id="statusbar">
    <span id="status-left">Line 1  Col 1  Insert</span>
    <span id="status-right">NONAME00.PAS</span>
  </div>
</div>

<script>
const editor = document.getElementById('editor');
const output = document.getElementById('output-screen');
const lineNums = document.getElementById('line-nums');
const statusLeft = document.getElementById('status-left');

const defaultCode = `program HelloWorld;
uses
  Crt;

var
  name : string;
  i    : integer;
  sum  : real;

begin
  ClrScr;
  WriteLn('╔══════════════════════════════╗');
  WriteLn('║   Welcome to Turbo Pascal!   ║');
  WriteLn('╚══════════════════════════════╝');
  WriteLn;

  Write('Enter your name: ');
  ReadLn(name);
  WriteLn('Hello, ', name, '!');
  WriteLn;

  { Calculate sum of 1..10 }
  sum := 0;
  for i := 1 to 10 do
    sum := sum + i;

  WriteLn('Sum of 1 to 10 = ', sum:0:0);
  WriteLn;
  WriteLn('Press any key to exit...');
  ReadKey;
end.`;

editor.value = defaultCode;
updateLineNums();
updateStatus();

editor.addEventListener('input', () => {
  updateLineNums();
  updateStatus();
  document.getElementById('modified-flag').textContent = ' [Modified]';
});

editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, en = editor.selectionEnd;
    editor.value = editor.value.substring(0,s) + '  ' + editor.value.substring(en);
    editor.selectionStart = editor.selectionEnd = s + 2;
    updateLineNums();
  }
  if (e.key === 'F9') { e.preventDefault(); doRun(); }
  if (e.altKey && e.key === 'F9') { e.preventDefault(); doCompile(); }
});

editor.addEventListener('keyup', updateStatus);
editor.addEventListener('click', updateStatus);
editor.addEventListener('scroll', syncScroll);

function syncScroll() {
  lineNums.scrollTop = editor.scrollTop;
}

function updateLineNums() {
  const lines = editor.value.split('\n').length;
  let html = '';
  for (let i = 1; i <= lines; i++) html += i + '\n';
  lineNums.textContent = html;
}

function updateStatus() {
  const txt = editor.value.substring(0, editor.selectionStart);
  const lines = txt.split('\n');
  const line = lines.length;
  const col = lines[lines.length-1].length + 1;
  statusLeft.textContent = `Line ${line}  Col ${col}  Insert`;
}

function log(text, cls='out-normal') {
  const span = document.createElement('span');
  span.className = 'out-line ' + cls;
  span.textContent = text;
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
}

function clearOutput() { output.innerHTML = ''; }

const menus = {
  file: [
    {label:'New', key:''},
    {label:'Open...', key:'F3'},
    {sep:true},
    {label:'Save', key:'F2', action: ()=>{ log('[ Saving NONAME00.PAS... ]','out-info'); log('File saved.','out-success'); }},
    {label:'Save As...', key:'F2'},
    {sep:true},
    {label:'Exit', key:'Alt+X'},
  ],
  edit: [
    {label:'Undo', key:'Ctrl+Z'},
    {label:'Redo', key:''},
    {sep:true},
    {label:'Cut', key:'Ctrl+X'},
    {label:'Copy', key:'Ctrl+C'},
    {label:'Paste', key:'Ctrl+V'},
    {sep:true},
    {label:'Select All', key:'Ctrl+A'},
  ],
  run: [
    {label:'Run', key:'F9', action: doRun},
    {label:'Step Over', key:'F8'},
    {label:'Trace Into', key:'F7'},
    {sep:true},
    {label:'Program Reset', key:'Ctrl+F2'},
  ],
  compile: [
    {label:'Compile', key:'Alt+F9', action: doCompile},
    {label:'Make', key:'F9'},
    {label:'Build', key:''},
    {sep:true},
    {label:'Destination: Memory', key:''},
  ],
  debug: [
    {label:'Toggle Breakpoint', key:'Ctrl+F8'},
    {label:'Breakpoints...', key:''},
    {label:'Call Stack', key:'Ctrl+F3'},
  ],
  options: [
    {label:'Compiler...', key:''},
    {label:'Linker...', key:''},
    {label:'Debugger...', key:''},
    {sep:true},
    {label:'Directories...', key:''},
    {label:'Environment...', key:''},
  ],
};

let activeMenu = null;
function toggleMenu(name, el) {
  const dd = document.getElementById('dropdown');
  if (activeMenu === name) { closeMenu(); return; }
  activeMenu = name;
  document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
  el.classList.add('active');
  const items = menus[name];
  let html = '';
  items.forEach(item => {
    if (item.sep) { html += '<div class="dd-sep"></div>'; return; }
    html += `<div class="dd-item" onclick="ddAction('${name}','${item.label}')">${item.label}<span style="color:#006666">${item.key||''}</span></div>`;
  });
  dd.innerHTML = html;
  dd.style.display = 'block';
  const rect = el.getBoundingClientRect();
  const tpRect = document.getElementById('tp').getBoundingClientRect();
  dd.style.left = (rect.left - tpRect.left) + 'px';
  dd.style.top = (rect.bottom - tpRect.top) + 'px';
}

function ddAction(menu, label) {
  closeMenu();
  const item = menus[menu].find(i => i.label === label);
  if (item && item.action) item.action();
}

function closeMenu() {
  document.getElementById('dropdown').style.display = 'none';
  document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
  activeMenu = null;
}

document.addEventListener('click', e => {
  if (!e.target.closest('#menubar') && !e.target.closest('#dropdown')) closeMenu();
});

function setCompileStatus(text, color) {
  const el = document.getElementById('compile-status');
  el.textContent = text;
  el.style.color = color;
}

function pascalCompile(code) {
  const errors = [];
  const lines = code.split('\n');

  const hasProgramOrBegin = /\bprogram\b|\bbegin\b/i.test(code);
  if (!hasProgramOrBegin) errors.push({line:1, msg:'Error 1: Program structure missing (no BEGIN found)'});

  const hasEnd = /\bend\s*\./i.test(code);
  if (!hasEnd && hasProgramOrBegin) errors.push({line: lines.length, msg:'Error 10: Unexpected end of file (missing END.)'});

  const beginCount = (code.match(/\bbegin\b/gi)||[]).length;
  const endCount = (code.match(/\bend\b/gi)||[]).length;
  if (Math.abs(beginCount - endCount) > 1) errors.push({line:lines.length, msg:'Error 13: BEGIN/END mismatch'});

  lines.forEach((line, idx) => {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('{') || trimmed.startsWith('//')) return;
    const skip = /^(program|uses|var|const|type|begin|end|procedure|function|interface|implementation)\b/i.test(trimmed);
    if (skip) return;
    const isAssign = /(:=|:$)/.test(trimmed);
    const isControl = /^(if|then|else|for|while|do|repeat|until|case|of|with)\b/i.test(trimmed);
    const isDecl = /^\w+\s*:\s*\w+/.test(trimmed) && !isAssign;
    const isWrite = /^(write|writeln|readln|read|clrscr|gotoxy|textcolor|textbackground|delay|halt|exit|inc|dec|str|val|randomize|random)\s*[;(]/i.test(trimmed);
    const isEnd2 = /^end[\s;.]/.test(trimmed);
    if (!isControl && !isDecl && !isWrite && !isAssign && !isEnd2 && trimmed !== '') {
      if (!/;$/.test(trimmed) && !/\{/.test(trimmed) && !/^(begin|then|do|else)$/i.test(trimmed)) {
      }
    }
  });

  const varSection = code.match(/\bvar\b([\s\S]*?)\bbegin\b/i);
  const usedVars = [];
  if (varSection) {
    const varBlock = varSection[1];
    const varDecls = varBlock.match(/(\w+)\s*:\s*\w+/g) || [];
    varDecls.forEach(d => {
      const varName = d.split(':')[0].trim();
      if (varName && varName.length > 1) usedVars.push(varName);
    });
  }

  return errors;
}

function extractProgramInfo(code) {
  const progMatch = code.match(/\bprogram\s+(\w+)/i);
  const progName = progMatch ? progMatch[1] : 'NONAME';
  const lines = code.split('\n').length;
  const chars = code.length;
  const varMatch = code.match(/\bvar\b([\s\S]*?)\bbegin\b/i);
  const varCount = varMatch ? (varMatch[1].match(/:/g)||[]).length : 0;
  const procMatch = code.match(/\b(procedure|function)\s+\w+/gi);
  const procCount = procMatch ? procMatch.length : 0;
  return { progName, lines, chars, varCount, procCount };
}

function doCompile() {
  clearOutput();
  const code = editor.value;
  log('Turbo Pascal  Version 7.0  Copyright (c) 1983,92 Borland','out-dim');
  log('','out-dim');

  setTimeout(() => {
    log('Compiling NONAME00.PAS...','out-info');
    log('','');

    setTimeout(() => {
      const errors = pascalCompile(code);
      const info = extractProgramInfo(code);

      if (errors.length === 0) {
        log(`  Program: ${info.progName}`, 'out-normal');
        log(`  Lines  : ${info.lines}`, 'out-normal');
        log(`  Vars   : ${info.varCount}`, 'out-normal');
        log(`  Procs  : ${info.procCount}`, 'out-normal');
        log('', '');
        log('  Code size    :   1,248 bytes', 'out-normal');
        log('  Data size    :     512 bytes', 'out-normal');
        log('  Stack size   :  16,384 bytes', 'out-normal');
        log('  Free memory  : 594,816 bytes', 'out-normal');
        log('', '');
        log('  0 Error(s)   0 Warning(s)','out-success');
        log('', '');
        log('Compile successful. Press F9 to Run.','out-success');
        setCompileStatus('  Compiled OK  ', '#55ff55');
        document.getElementById('modified-flag').textContent = '';
      } else {
        errors.forEach(e => {
          log(`  NONAME00.PAS(${e.line}): ${e.msg}`, 'out-error');
        });
        log('', '');
        log(`  ${errors.length} Error(s)   0 Warning(s)`, 'out-error');
        log('', '');
        log('Compile failed.', 'out-error');
        setCompileStatus(`  ${errors.length} Error(s)  `, '#ff5555');
      }
    }, 400);
  }, 100);
}

function interpretPascal(code) {
  const lines = [];
  const printLine = s => lines.push(String(s));
  const print = s => { if (lines.length === 0) lines.push(''); lines[lines.length-1] += String(s); };

  try {
    const vars = {};
    const codeUpper = code.toUpperCase();

    const varSection = code.match(/\bvar\b([\s\S]*?)\bbegin\b/i);
    if (varSection) {
      const decls = varSection[1].split(';');
      decls.forEach(decl => {
        const m = decl.match(/(\w+(?:\s*,\s*\w+)*)\s*:\s*(\w+)/);
        if (m) {
          const names = m[1].split(',').map(s=>s.trim());
          const type = m[2].trim().toLowerCase();
          names.forEach(n => {
            if (!n) return;
            if (type === 'integer' || type === 'longint' || type === 'word' || type === 'byte') vars[n.toLowerCase()] = 0;
            else if (type === 'real' || type === 'single' || type === 'double') vars[n.toLowerCase()] = 0.0;
            else if (type === 'boolean') vars[n.toLowerCase()] = false;
            else vars[n.toLowerCase()] = '';
          });
        }
      });
    }

    const bodyMatch = code.match(/\bbegin\b([\s\S]*)\bend\s*\./i);
    if (!bodyMatch) { printLine('Error: No BEGIN..END. found'); return lines; }
    const body = bodyMatch[1];

    const stmts = splitStatements(body);

    function evalExpr(expr, localVars) {
      expr = expr.trim();
      const all = Object.assign({}, vars, localVars||{});

      expr = expr.replace(/\b(\w+)\b/g, (m) => {
        const k = m.toLowerCase();
        if (k in all) return JSON.stringify(all[k]);
        return m;
      });

      expr = expr.replace(/:(\d+):(\d+)/g, '');
      expr = expr.replace(/:\d+/g, '');
      expr = expr.replace(/'([^']*)'/g, '`$1`');
      expr = expr.replace(/`([^`]*)`/g, (m,s) => JSON.stringify(s));

      expr = expr.replace(/\bdiv\b/gi, 'Math.trunc(') .replace(/\bmod\b/gi, '%');
      expr = expr.replace(/\bsqrt\b/gi,'Math.sqrt');
      expr = expr.replace(/\babs\b/gi,'Math.abs');
      expr = expr.replace(/\broad\b/gi,'Math.round');
      expr = expr.replace(/\btrunc\b/gi,'Math.trunc');
      expr = expr.replace(/\border\b\((\w+)\)/gi, (_,c)=>c.charCodeAt(0));
      expr = expr.replace(/\bchr\b/gi,'String.fromCharCode');
      expr = expr.replace(/\blength\b/gi,'s=>s.length');
      expr = expr.replace(/\btrue\b/gi,'true').replace(/\bfalse\b/gi,'false');
      expr = expr.replace(/<>/g,'!==').replace(/\band\b/gi,'&&').replace(/\bor\b/gi,'||').replace(/\bnot\b/gi,'!');

      try { return eval(expr); } catch(e) { return expr.replace(/`/g,''); }
    }

    function formatVal(v, fmt) {
      if (fmt) {
        const m = fmt.match(/:(\d+)(?::(\d+))?/);
        if (m && m[2] !== undefined) return Number(v).toFixed(parseInt(m[2]));
        if (m) return String(v).padStart(parseInt(m[1]));
      }
      if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
      if (typeof v === 'number' && !Number.isInteger(v)) return v.toFixed(2);
      return String(v);
    }

    function splitStatements(block) {
      const stmts = [];
      let depth = 0, cur = '', inStr = false;
      for (let i = 0; i < block.length; i++) {
        const c = block[i];
        if (c === "'") inStr = !inStr;
        if (!inStr) {
          if (c === '(') depth++;
          if (c === ')') depth--;
          if (c === '{') { while(i < block.length && block[i] !== '}') i++; continue; }
          if (c === ';' && depth === 0) { stmts.push(cur.trim()); cur = ''; continue; }
        }
        cur += c;
      }
      if (cur.trim()) stmts.push(cur.trim());
      return stmts;
    }

    function execBlock(stmts, localVars) {
      let i = 0;
      while (i < stmts.length) {
        const s = stmts[i].trim();
        if (!s || /^\/\//.test(s)) { i++; continue; }

        const wlMatch = s.match(/^writeln\s*\(([\s\S]*)\)$/i) || s.match(/^writeln$/i);
        if (wlMatch) {
          if (!wlMatch[1] && s.toLowerCase() === 'writeln') { printLine(''); i++; continue; }
          const args = splitArgs(wlMatch[1]||'');
          let out = '';
          args.forEach(a => {
            const fmtMatch = a.match(/^([\s\S]+?)(\s*:\s*\d+(?:\s*:\s*\d+)?)$/);
            if (fmtMatch) out += formatVal(evalExpr(fmtMatch[1].trim(), localVars), fmtMatch[2]);
            else out += formatVal(evalExpr(a.trim(), localVars));
          });
          printLine(out); i++; continue;
        }

        const wMatch = s.match(/^write\s*\(([\s\S]*)\)$/i);
        if (wMatch) {
          const args = splitArgs(wMatch[1]);
          let out = '';
          args.forEach(a => {
            const fmtMatch = a.match(/^([\s\S]+?)(\s*:\s*\d+(?:\s*:\s*\d+)?)$/);
            if (fmtMatch) out += formatVal(evalExpr(fmtMatch[1].trim(), localVars), fmtMatch[2]);
            else out += formatVal(evalExpr(a.trim(), localVars));
          });
          print(out); i++; continue;
        }

        if (/^clrscr$/i.test(s)) { i++; continue; }
        if (/^readkey$/i.test(s)) { i++; continue; }
        if (/^readln$/i.test(s)) { printLine('[ReadLn - using default value]'); i++; continue; }
        const rlMatch = s.match(/^readln\s*\((\w+)\)$/i);
        if (rlMatch) {
          const v = rlMatch[1].toLowerCase();
          const cur = (localVars||vars)[v];
          const defVal = typeof cur === 'number' ? 42 : 'World';
          if (localVars && v in localVars) localVars[v] = defVal;
          else vars[v] = defVal;
          printLine(`[Input: ${defVal}]`);
          i++; continue;
        }

        if (/^halt(?:\(\d*\))?$/i.test(s)) break;
        if (/^exit$/i.test(s)) break;

        const incMatch = s.match(/^inc\s*\((\w+)(?:,\s*(\d+))?\)$/i);
        if (incMatch) {
          const v = incMatch[1].toLowerCase();
          const by = incMatch[2] ? parseInt(incMatch[2]) : 1;
          if (localVars && v in localVars) localVars[v] = (localVars[v]||0) + by;
          else vars[v] = (vars[v]||0) + by;
          i++; continue;
        }
        const decMatch = s.match(/^dec\s*\((\w+)(?:,\s*(\d+))?\)$/i);
        if (decMatch) {
          const v = decMatch[1].toLowerCase();
          const by = decMatch[2] ? parseInt(decMatch[2]) : 1;
          if (localVars && v in localVars) localVars[v] = (localVars[v]||0) - by;
          else vars[v] = (vars[v]||0) - by;
          i++; continue;
        }

        const assignMatch = s.match(/^(\w+)\s*:=\s*([\s\S]+)$/i);
        if (assignMatch) {
          const v = assignMatch[1].toLowerCase();
          const val = evalExpr(assignMatch[2], localVars);
          if (localVars && v in localVars) localVars[v] = val;
          else vars[v] = val;
          i++; continue;
        }

        const forMatch = s.match(/^for\s+(\w+)\s*:=\s*(.+?)\s+to\s+(.+?)\s+do\s+([\s\S]*)$/i) ||
                         s.match(/^for\s+(\w+)\s*:=\s*(.+?)\s+downto\s+(.+?)\s+do\s+([\s\S]*)$/i);
        if (forMatch) {
          const isDown = /downto/i.test(s);
          const vn = forMatch[1].toLowerCase();
          let from = parseInt(evalExpr(forMatch[2], localVars));
          let to   = parseInt(evalExpr(forMatch[3], localVars));
          let body2 = forMatch[4].trim();
          const lv = Object.assign({}, localVars||{}, vars);
          let bodyStmts;
          if (/^begin\b/i.test(body2)) {
            const bm = body2.match(/^begin\b([\s\S]*)\bend\b/i);
            bodyStmts = bm ? splitStatements(bm[1]) : [];
          } else {
            bodyStmts = [body2];
          }
          let guard = 0;
          for (let v2 = from; isDown ? v2 >= to : v2 <= to; isDown ? v2-- : v2++) {
            lv[vn] = v2; vars[vn] = v2;
            execBlock(bodyStmts, lv);
            if (++guard > 500) { printLine('[Loop limit reached]'); break; }
          }
          i++; continue;
        }

        const whileMatch = s.match(/^while\s+([\s\S]+?)\s+do\s+([\s\S]*)$/i);
        if (whileMatch) {
          let cond = whileMatch[1], body2 = whileMatch[2].trim();
          let bodyStmts;
          if (/^begin\b/i.test(body2)) {
            const bm = body2.match(/^begin\b([\s\S]*)\bend\b/i);
            bodyStmts = bm ? splitStatements(bm[1]) : [];
          } else { bodyStmts = [body2]; }
          const lv = Object.assign({}, localVars||{}, vars);
          let guard = 0;
          while (evalExpr(cond, lv)) {
            execBlock(bodyStmts, lv);
            Object.assign(vars, lv);
            if (++guard > 500) { printLine('[Loop limit reached]'); break; }
          }
          i++; continue;
        }

        const ifMatch = s.match(/^if\s+([\s\S]+?)\s+then\s+([\s\S]+?)(?:\s+else\s+([\s\S]+))?$/i);
        if (ifMatch) {
          const cond = evalExpr(ifMatch[1], localVars);
          const lv = Object.assign({}, localVars||{}, vars);
          if (cond) {
            let th = ifMatch[2].trim();
            if (/^begin\b/i.test(th)) { const bm = th.match(/^begin\b([\s\S]*)\bend\b/i); execBlock(bm?splitStatements(bm[1]):[], lv); }
            else execBlock([th], lv);
          } else if (ifMatch[3]) {
            let el = ifMatch[3].trim();
            if (/^begin\b/i.test(el)) { const bm = el.match(/^begin\b([\s\S]*)\bend\b/i); execBlock(bm?splitStatements(bm[1]):[], lv); }
            else execBlock([el], lv);
          }
          Object.assign(vars, lv);
          i++; continue;
        }

        i++;
      }
    }

    function splitArgs(s) {
      const args = []; let depth = 0, cur = '', inStr = false;
      for (let i = 0; i < s.length; i++) {
        const c = s[i];
        if (c === "'") inStr = !inStr;
        if (!inStr && c === '(') depth++;
        if (!inStr && c === ')') depth--;
        if (!inStr && c === ',' && depth === 0) { args.push(cur.trim()); cur = ''; continue; }
        cur += c;
      }
      if (cur.trim()) args.push(cur.trim());
      return args;
    }

    execBlock(stmts);

  } catch(e) {
    lines.push('Runtime error: ' + e.message);
  }
  return lines;
}

function doRun() {
  clearOutput();
  log('Turbo Pascal  Version 7.0  Copyright (c) 1983,92 Borland','out-dim');
  log('Compiling...','out-info');

  setTimeout(() => {
    const errors = pascalCompile(editor.value);
    if (errors.length > 0) {
      errors.forEach(e => log('  ' + e.msg, 'out-error'));
      log('','');
      log('Compile failed. Cannot run.','out-error');
      setCompileStatus(`  ${errors.length} Error(s)  `, '#ff5555');
      return;
    }
    log('Compile successful.','out-success');
    log('','');
    log('┌─────────────────────────────────────────┐','out-dim');
    log('│              Program Output              │','out-dim');
    log('└─────────────────────────────────────────┘','out-dim');
    log('','');

    setTimeout(() => {
      try {
        const outputLines = interpretPascal(editor.value);
        outputLines.forEach(l => log(l, 'out-normal'));
      } catch(e) {
        log('Runtime error: ' + e.message, 'out-error');
      }
      log('','');
      log('─────────────────────────────────────────','out-dim');
      log('Program exited normally.','out-dim');
      setCompileStatus('  Run OK  ', '#55ff55');
    }, 200);
  }, 300);
}

document.addEventListener('keydown', e => {
  if (e.key === 'F9' && !e.altKey) { e.preventDefault(); doRun(); }
  if (e.key === 'F9' && e.altKey) { e.preventDefault(); doCompile(); }
  if (e.key === 'F1') { e.preventDefault(); showHelp(); }
  if (e.key === 'F2') { e.preventDefault(); log('File saved.','out-success'); }
});

function showHelp() {
  clearOutput();
  log('─── Turbo Pascal 7.0 Quick Reference ───────','out-info');
  log('','');
  log('KEYBOARD SHORTCUTS:','out-warn');

  log('  Alt+F9    Compile only','out-normal');
  log('  F2        Save file','out-normal');
  log('  F1        This help','out-normal');
  log('  Ctrl+Z    Undo','out-normal');
  log('','');
  log('SUPPORTED PASCAL FEATURES:','out-warn');
  log('  var, begin, end, for..to..do','out-normal');
  log('  while..do, if..then..else','out-normal');
  log('  writeln, write, readln','out-normal');
  log('  inc, dec, halt, exit','out-normal');
  log('  integer, real, string, boolean','out-normal');
  log('  clrscr, readkey (Crt unit)','out-normal');
  log('','');
  log('TRY THESE EXAMPLES:','out-warn');
  log('  > FizzBuzz, Fibonacci, Factorial','out-dim');
  log('  > Bubble sort, Prime sieve','out-dim');
  log('  > ASCII art patterns','out-dim');
}

doCompile();
